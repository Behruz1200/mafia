# New file: /etc/nginx/sites-available/zz-mafia.conf (then symlink into
# sites-enabled). It only adds two new hostnames; the store app's server
# blocks are untouched. Named zz- so it loads after the store's file and the
# store stays the default server for unknown names and bare-IP requests.
# Replace CHANGE_ME_DOMAIN everywhere. TLS via certbot webroot (README).

# The store's two names fill nginx's default name table (32); two more
# overflow it. 64 is the usual size and changes nothing else.
server_names_hash_bucket_size 64;

# Send "Connection: upgrade" only on WebSocket requests. Sending it on plain
# API calls makes the game server drop the request body (400 bad_request).
map $http_upgrade $mafia_connection_upgrade {
    default upgrade;
    '' "";
}

# Plain HTTP: certificate challenges, everything else goes to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name api.CHANGE_ME_DOMAIN video.CHANGE_ME_DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/mafia-acme; }
    location / { return 301 https://$host$request_uri; }
}

# Game API + realtime WebSocket
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.CHANGE_ME_DOMAIN;
    ssl_certificate /etc/letsencrypt/live/mafia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mafia/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mafia_connection_upgrade;
        proxy_read_timeout 3600s;
    }
}

# LiveKit signalling (media goes over UDP 50000-50100 / TCP 7881 directly)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name video.CHANGE_ME_DOMAIN;
    ssl_certificate /etc/letsencrypt/live/mafia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mafia/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mafia_connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
