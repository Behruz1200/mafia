# New file: /etc/nginx/sites-available/mafia.conf (then symlink into
# sites-enabled). It only adds two new hostnames; the store app's server
# blocks are untouched. TLS certificates via certbot for both names.

# Game API + realtime WebSocket
server {
    listen 443 ssl;
    server_name api.CHANGE_ME_DOMAIN;
    # ssl_certificate / ssl_certificate_key: added by certbot

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}

# LiveKit signalling (media itself goes over UDP 50000-50100 directly)
server {
    listen 443 ssl;
    server_name video.CHANGE_ME_DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
