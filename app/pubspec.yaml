name: mafia_app
description: The Mafia card game with live video, for iOS and Android.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  contracts: any
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: ^0.20.3
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^11.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.8
  livekit_client: ^2.14.0
  in_app_purchase: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  # Neon night type (SIL Open Font License, see the OFL files beside them).
  # Static weights cut from the Google Fonts variable fonts and trimmed to
  # Latin, Latin Extended and Cyrillic. Manrope also maps the Uzbek
  # okina (U+02BB) to its left quote, which it lacks.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-600.ttf
          weight: 600
        - asset: assets/fonts/Unbounded-700.ttf
          weight: 700
        - asset: assets/fonts/Unbounded-800.ttf
          weight: 800
