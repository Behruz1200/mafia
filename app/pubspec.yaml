version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  contracts: any
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: ^0.20.3
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^11.2.0
  sign_in_with_apple: ^8.2.0
