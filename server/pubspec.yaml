name: server
description: >-
  The Mafia game server. Runs in Docker on our own server in Uzbekistan.
  Hosts auth, rooms and the realtime socket, video grants and the wallet.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  contracts: any
  mafia_engine: any
  postgres: ^3.4.0
  shelf: ^1.4.0
  shelf_router: ^1.1.0
  shelf_web_socket: ^3.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
