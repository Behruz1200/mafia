name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - name: Get packages (whole workspace)
        run: flutter pub get
      - name: Generate translations
        working-directory: app
        run: flutter gen-l10n
      - name: Format
        run: >-
          dart format --output=none --set-exit-if-changed
          packages server app/lib/app.dart app/lib/main.dart
          app/lib/core app/lib/features app/test
      - name: contracts
        working-directory: packages/contracts
        run: dart analyze --fatal-infos && dart test
      - name: mafia_engine
        working-directory: packages/mafia_engine
        run: dart analyze --fatal-infos && dart test
      - name: server
        working-directory: server
        run: dart analyze --fatal-infos && dart test
      - name: app
        working-directory: app
        run: flutter analyze --fatal-infos && flutter test

  server-binary:
    name: Server binary (production, Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile
        run: |
          mkdir -p out
          dart compile exe server/bin/server.dart -o out/server
          cp -r server/migrations out/
      - name: Smoke test
        run: |
          HOST=127.0.0.1 PORT=8080 ./out/server &
          for i in $(seq 1 20); do curl -fs localhost:8080/healthz && exit 0; sleep 1; done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: mafia-server-linux-x64
          path: out/

  server-image:
    name: Server Docker image (local dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f server/Dockerfile -t mafia-server .
      - name: Smoke test
        run: |
          docker run -d --rm -p 8080:8080 --name ms mafia-server
          for i in $(seq 1 20); do curl -fs localhost:8080/healthz && exit 0; sleep 1; done
          docker logs ms; exit 1

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - run: flutter pub get
      - working-directory: app
        run: flutter build apk --debug

  ios:
    name: iOS build (no signing)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - run: flutter pub get
      - working-directory: app
        run: flutter build ios --debug --no-codesign
